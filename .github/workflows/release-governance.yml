name: Release Governance

on:
  pull_request:
    branches:
      - executive-benchmark-engine
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_PUBLIC_SUPABASE_URL: "https://ci-placeholder.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-anon-key"
      NEXT_PUBLIC_SITE_URL: "https://example.invalid"
      CONTACT_EMAIL: "ci@example.invalid"
      EMAIL_FROM: "Nexus Pavilion CI <no-reply@example.invalid>"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Launch regression tests
        run: npm run test:launch

      - name: Production build
        run: npm run build
